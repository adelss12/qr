<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR">
<meta name="description" content="أنشئ رموز QR وخصّص شكلها، واقرأ أي رمز بالكاميرا. كل شيء داخل متصفحك.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>صانع QR</title>
<style>
:root{
  --bg:#F1F6F5; --surface:#FFFFFF; --surface-2:#F5F9F8; --ink:#11211F; --ink-2:#4E615D; --ink-3:#6F817D; --line:#D9E4E1;
  --primary:#0F766E; --primary-ink:#fff; --primary-soft:#D8EFEB; --accent:#0E7490; --danger:#B4352A; --danger-soft:#F8E1DE; --warn:#8A5A00; --warn-soft:#FBEFD5;
  --shadow:0 1px 2px rgba(17,33,31,.06),0 8px 24px rgba(17,33,31,.07);
  --font:-apple-system,"SF Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1513; --surface:#13201D; --surface-2:#192825; --ink:#E5EFEC; --ink-2:#A2B4AF; --ink-3:#81938E; --line:#25352F;
  --primary:#4CC2B0; --primary-ink:#052520; --primary-soft:#163A34; --accent:#67C6DD; --danger:#F08B7F; --danger-soft:#3C201C; --warn:#E8B85A; --warn-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;min-height:100dvh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:11px}
.brand h1{margin:0;font-size:21px;line-height:1.2}
.brand small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:500}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;min-height:42px;border-radius:11px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.side{position:sticky;top:14px}
.grid>*{min-width:0}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static}}

.types{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px -18px 16px;padding:2px 18px 4px}
.types::-webkit-scrollbar{display:none}
/* الكمبيوتر (فأرة): الأنواع تلتف في صفوف بدل التمرير الأفقي */
@media (hover:hover) and (pointer:fine){.types{flex-wrap:wrap;overflow:visible;margin:0 0 16px;padding:0}}
.type{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-weight:600;font-size:14.5px;min-height:44px}
.type.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.fields{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12.5px}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;outline:none}
textarea.input{min-height:96px;resize:vertical;line-height:1.7}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.ltr{direction:ltr;text-align:right}
select.input{-webkit-appearance:none;appearance:none}
.pw{position:relative}.pw .input{padding-left:48px}.pw button{position:absolute;left:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--ink-3);border-radius:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-line{background:transparent;border-color:var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions .wide{grid-column:1/-1}

/* المعاينة */
.preview{display:flex;flex-direction:column;align-items:center;gap:10px}
.qrbox{width:100%;aspect-ratio:1;max-width:320px;display:grid;place-items:center;border-radius:16px;background:repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/18px 18px}
.qrbox svg,.qrbox img{width:100%;height:100%;display:block;object-fit:contain}
.qrbox img{-webkit-touch-callout:default;user-select:auto}
.qrbox.framed{aspect-ratio:auto}
.hint{color:var(--ink-3);font-size:13.5px;margin:0;text-align:center}
.payload{width:100%;font-size:12.5px;color:var(--ink-3);direction:ltr;text-align:left;background:var(--surface-2);border-radius:10px;padding:8px 10px;word-break:break-all;max-height:68px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.warn{width:100%;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.empty{color:var(--ink-3);text-align:center;padding:40px 10px}
.empty .ico{width:44px;height:44px;stroke-width:1.3}

/* التخصيص */
details.custom{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
details.custom summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;cursor:pointer}
details.custom summary::-webkit-details-marker{display:none}
details.custom summary .ico{transition:transform .2s}
details.custom[open] summary .ico{transform:rotate(180deg)}
.opts{display:flex;flex-direction:column;gap:16px;padding-bottom:6px}
.opt-label{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--primary)}
.sw-pick{position:relative;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-pick input{position:absolute;inset:-6px;width:48px;height:48px;opacity:0;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 12px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:7px}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chip svg.demo{width:18px;height:18px}
.logo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}

/* القارئ */
.scan-view{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#000}
.scan-view video{width:100%;height:100%;object-fit:cover}
.scan-view .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.result{margin-top:16px}
.result h3{margin:0 0 4px;font-size:17px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-3);flex:none}
.kv b{font-weight:600;word-break:break-word;text-align:left}
.kv .copy{border:0;background:var(--primary-soft);color:var(--primary);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;flex:none}

/* السجل */
.hist{display:flex;flex-direction:column}
.h-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.h-item:last-child{border-bottom:0}
.h-thumb{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;background:#fff}
.h-thumb svg{width:100%;height:100%}
.h-main{flex:1;min-width:0;border:0;background:none;text-align:right;padding:0}
.h-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-main small{color:var(--ink-3);font-size:12.5px}
.h-del{border:0;background:none;color:var(--ink-3);width:40px;height:40px;border-radius:10px;display:grid;place-items:center}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:13px;font-weight:600;font-size:14.5px;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
footer{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="apple-touch-icon.png" alt=""><div><h1>صانع QR</h1><small>كل شيء يُعالج داخل متصفحك</small></div></div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" class="on" data-tab="make"><svg class="ico"><use href="#i-plus"/></svg>إنشاء</button>
    <button type="button" role="tab" data-tab="scan"><svg class="ico"><use href="#i-scan"/></svg>قراءة</button>
    <button type="button" role="tab" data-tab="hist"><svg class="ico"><use href="#i-clock"/></svg>السجل</button>
  </nav>

  <!-- إنشاء -->
  <section id="tab-make" class="grid">
    <div class="card">
      <div class="types" id="types" role="tablist" aria-label="نوع الرمز"></div>
      <form class="fields" id="form" autocomplete="off" onsubmit="return false"></form>

      <details class="custom" id="custom">
        <summary><span>تخصيص الشكل</span><svg class="ico"><use href="#i-down"/></svg></summary>
        <div class="opts">
          <div><div class="opt-label">لون الرمز</div><div class="swatches" id="fgSw"></div></div>
          <div><div class="opt-label">لون الخلفية</div><div class="swatches" id="bgSw"></div></div>
          <div><div class="opt-label">شكل النقاط</div><div class="chips" id="dotChips"></div></div>
          <div><div class="opt-label">شكل الزوايا</div><div class="chips" id="eyeChips"></div></div>
          <div><div class="opt-label">شعار في المنتصف</div>
            <div class="logo-row"><img class="logo-thumb" id="logoThumb" alt="" hidden>
              <label class="btn btn-soft btn-sm"><svg class="ico"><use href="#i-image"/></svg><span id="logoBtnTxt">اختيار صورة</span><input type="file" accept="image/*" id="logoInput" hidden></label>
              <button type="button" class="btn btn-line btn-sm" id="logoRemove" hidden>إزالة الشعار</button></div></div>
          <label class="field"><span>نص تحت الرمز</span><input class="input" id="caption" maxlength="40" placeholder="مثال: امسح للاتصال بالشبكة"></label>
          <label class="check"><input type="checkbox" id="frame"> إطار جاهز للطباعة</label>
        </div>
      </details>
    </div>

    <aside class="card side">
      <div class="preview" id="preview">
        <div class="qrbox" id="qrbox"></div>
        <div class="warn" id="warn" hidden></div>
        <p class="hint" id="hint"></p>
        <div class="payload" id="payload" hidden></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="shareBtn"><svg class="ico"><use href="#i-share"/></svg>مشاركة</button>
        <button type="button" class="btn btn-primary" id="copyBtn"><svg class="ico"><use href="#i-copy"/></svg>نسخ الصورة</button>
        <button type="button" class="btn btn-soft" id="pngBtn"><svg class="ico"><use href="#i-down2"/></svg>صورة PNG</button>
        <button type="button" class="btn btn-soft" id="svgBtn"><svg class="ico"><use href="#i-down2"/></svg>ملف SVG</button>
      </div>
    </aside>
  </section>

  <!-- قراءة -->
  <section id="tab-scan" hidden>
    <div class="card">
      <div class="scan-view" id="scanView" hidden><video id="video" playsinline muted></video><div class="frame"></div></div>
      <div class="empty" id="scanIdle"><svg class="ico"><use href="#i-scan"/></svg><p>وجّه الكاميرا إلى رمز QR، أو اختر صورة فيها رمز.</p></div>
      <div class="scan-actions">
        <button type="button" class="btn btn-primary" id="camBtn"><svg class="ico"><use href="#i-camera"/></svg>تشغيل الكاميرا</button>
        <label class="btn btn-soft"><svg class="ico"><use href="#i-image"/></svg>اختيار صورة<input type="file" accept="image/*" id="scanFile" hidden></label>
      </div>
      <div class="result" id="scanResult" hidden></div>
    </div>
  </section>

  <!-- السجل -->
  <section id="tab-hist" hidden>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <p class="hint" style="text-align:right">آخر الرموز التي حمّلتها أو شاركتها. محفوظة على هذا الجهاز فقط.</p>
        <button type="button" class="btn btn-line btn-sm" id="histClear">مسح السجل</button>
      </div>
      <div class="hist" id="hist"></div>
    </div>
  </section>

  <footer>صانع QR — لا تُرسل بياناتك إلى أي خادم</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M4 12h16"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-down2" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M6 11H5v9.5h14V11h-1"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 2.5-2.5L20 19"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5h3l1.5-2.5h7L17 8.5h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="t-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".8"/></symbol>
  <symbol id="t-url" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="t-contact" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9.5" cy="11" r="2.3"/><path d="M5.8 16.5c.6-1.8 2-2.7 3.7-2.7s3.1.9 3.7 2.7M14.5 10h3.5M14.5 13.5h3.5"/></symbol>
  <symbol id="t-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.2-3.8A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.3-1.8-1-.9.8a4 4 0 0 1-2.3-2.3l.8-.9-1-1.8z"/></symbol>
  <symbol id="t-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a10 10 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="t-sms" viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></symbol>
  <symbol id="t-email" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="t-geo" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  <symbol id="t-text" viewBox="0 0 24 24"><path d="M5 6.5h14M5 11h14M5 15.5h9"/></symbol>
</defs></svg>

<script src="js/qr-engine.js?v=2"></script>
<script src="js/app.js?v=3"></script>
<script src="https://adelss12.github.io/back.js" defer></script>
</body>
</html>
